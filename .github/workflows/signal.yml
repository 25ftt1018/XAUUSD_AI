name: signal-30min
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m src.data_fetch
      - run: python -m src.train
      - run: python -m src.train_h4
      - run: python -m src.train_m30
      - run: python check_signal.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Scoreboard lives on Cloud, not the runner: push the log back so the
      # web app can display cron-fired signals. No-op when nothing new.
      - run: |
          git config user.name "xau-bot"
          git config user.email "xau-bot@local"
          git add -f data/signals_log.csv || true
          git diff --cached --quiet || git commit -m "scoreboard: cron signal log" || true
          git pull --rebase || true
          git push || true
